          id: conditionGroup_9dU4Ya
          conditions:
            - id: conditionItem_measureClarify
              condition: |-
                =IsMatch(Lower(Topic.OriginalQ), "gained or lost|gain or lose|gained/lost|gained share|lost share|gaining or losing|gain or loss|win or lose", MatchOptions.Contains)
                    And Not(IsMatch(Lower(Topic.OriginalQ), "kisqali|breast cancer", MatchOptions.Contains))
