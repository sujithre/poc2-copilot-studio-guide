                    1. Absolute share change (percentage-point change vs PY / vs TGT)
                    2. Growth vs market benchmark (product growth relative to market growth)
                  entity: StringPrebuiltEntity

                - kind: SetVariable
                  id: setVariable_measureQuery
                  variable: Topic.Query5
                  value: |-
