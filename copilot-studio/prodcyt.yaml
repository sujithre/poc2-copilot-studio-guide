kind: AdaptiveDialog

modelDescription: Use when the user asks about prescription or brand performance metrics - NBRx, TRx, NRx, market share, scripts, demand, patient starts - or brand commercial tactics, campaigns, or launch readiness.

beginDialog:
  kind: OnRecognizedIntent
  id: main

  # ------------------------------------------------------------------
  # Trigger phrases, not just a modelDescription.
  #
  # With an empty intent the orchestrator was free to answer the same
  # question straight from the knowledge source instead of entering this
  # topic. That path never applies the instructions below - no metric
  # provenance, no denominator naming, no refusal to quote an unattributed
  # chart series - so one question could return two answers of very
  # different quality, and the weaker one looked just as confident.
  #
  # Phrases are brand-agnostic on purpose: they describe the SHAPE of a
  # product-performance question, so a new brand needs no edit here.
  # ------------------------------------------------------------------
  intent:
    triggerQueries:
      - Has the brand gained or lost share
      - Did we gain or lose market share
      - What is the latest new patient share
      - What is the latest NBRx share
      - What is the latest TRx share
      - What is the NBRx trend
      - What is the TRx trend over the last three reported periods
      - How is the brand performing versus target
      - How is the brand performing versus prior year
      - Which brands gained the most share
      - Rank our brands by share growth
      - What is the market share for this brand
      - How did scripts and demand track this month
      - What is the patient acquisition trend
      - Show NBRx and TRx versus plan

  actions:
    # ------------------------------------------------------------------
    # 1. Capture the question ONCE. It is never rewritten.
    #
    # Previously each clarifier appended its answer to the search text
    # ("...? for both eBC and mBC indications (overall)"). Retrieval is
    # text-driven, so that changed what came back: it pulled another brand's
    # indication pages into the result set and pushed the correct figure out
    # of the top ten. A clarification is an INSTRUCTION about how to answer,
    # not part of the query. Every clarifier writes into Topic.Clarifier,
    # which is injected into the instructions; userInput stays untouched.
    # ------------------------------------------------------------------
    - kind: SetVariable
      id: setOriginalQ
      displayName: Capture question
      variable: Topic.OriginalQ
      value: =System.Activity.Text

    - kind: SetVariable
      id: initClarifier
      displayName: Reset clarifier
      variable: Topic.Clarifier
      value: =""

    # ------------------------------------------------------------------
    # 2. Indication - only when the question is about a brand reported by
    #    indication and has not already named one.
    #
    # This used to be the catch-all elseActions of the whole topic, so it
    # fired for every question that was not a trend question, including
    # brands with no breast-cancer indication at all. None of the three
    # ConditionGroups below has an elseActions: an unmatched condition falls
    # straight through to the single answer step.
    # ------------------------------------------------------------------
    - kind: ConditionGroup
      id: maybeAskIndication
      displayName: Indication needed?
      conditions:
        - id: askIndication
          condition: |-
            =IsMatch(Lower(Topic.OriginalQ), "kisqali|breast cancer", MatchOptions.Contains)
            And Not(IsMatch(Lower(Topic.OriginalQ), "ebc|mbc|early breast|metastatic|pan-indication|both|overall", MatchOptions.Contains))
          actions:
            - kind: Question
              id: questionIndication
              interruptionPolicy:
                allowInterruption: true

              variable: init:Topic.IndicationChoice
              prompt: `Quick check - is that for eBC (early breast cancer), mBC (metastatic), or both?`
              entity:
                kind: ClosedListEntityReference
                entityId: cr1df_FinSightUSV2.entity.Indication
                selectedItems:
                  - HThfpP
                  - tbIYEe
                  - 25ylsL

            - kind: SetVariable
              id: setIndicationScope
              displayName: Record indication scope
              variable: Topic.Clarifier
              value: |-
                =Topic.Clarifier & "INDICATION SCOPE CHOSEN BY THE USER: " & Text(Topic.IndicationChoice) & ". Restrict the answer to that indication; if the user chose both or overall, lead with the pan-indication total and then split by indication. "

    # ------------------------------------------------------------------
    # 3. Period basis - only for a trend question that has not stated one.
    #
    # NOTE: there is deliberately NO measurement-basis clarifier. "Gained or
    # lost share" has two valid bases (absolute share-point change, and growth
    # versus the market) and they can disagree, but asking the user to pick
    # costs a turn on the most common question in the topic. The instructions
    # below require BOTH to be shown, clearly separated, so the reader can see
    # the disagreement rather than having to anticipate it.
    # ------------------------------------------------------------------
    - kind: ConditionGroup
      id: maybeAskPeriodBasis
      displayName: Period basis needed?
      conditions:
        - id: askPeriodBasis
          condition: |-
            =IsMatch(Lower(Topic.OriginalQ), "trend|last 3 periods|last three|lately", MatchOptions.Contains)
            And Not(IsMatch(Lower(Topic.OriginalQ), "r3m|rolling|trailing|calendar month", MatchOptions.Contains))
          actions:
            - kind: Question
              id: questionPeriodBasis
              interruptionPolicy:
                allowInterruption: true

              variable: init:Topic.BasisChoice
              prompt: `Quick check - the last 3 calendar months, or a rolling 3-month (R3M) basis?`
              entity:
                kind: ClosedListEntityReference
                entityId: cr1df_FinSightUSV2.entity.PeriodBasis
                selectedItems:
                  - vPH7Yg
                  - tVcEiS

            - kind: SetVariable
              id: setPeriodScope
              displayName: Record period basis
              variable: Topic.Clarifier
              value: |-
                =Topic.Clarifier & "PERIOD BASIS CHOSEN BY THE USER: " & Text(Topic.BasisChoice) & ". Use that basis and name it. "

    # ------------------------------------------------------------------
    # 4. ONE answer step, ONE set of instructions.
    #
    # There used to be five copies across five branches and they had drifted:
    # the branches a plain "did X gain or lose share" question could reach
    # were missing the rule that stops a sub-population figure being reported
    # as the whole-market read - the exact rule that failure needed. A rule
    # that lives in one branch protects only the questions that land there.
    #
    # The rules are keyed on properties of the data - whose number, which
    # population, which period, which denominator - rather than on named
    # brands or worked examples, so a new brand or deck inherits them.
    # ------------------------------------------------------------------
    - kind: SearchAndSummarizeContent
      id: answerProductStrategy
      displayName: Answer from Product Strategy
      userInput: =Topic.OriginalQ

      additionalInstructions: |-
        You answer questions about US brand performance metrics (NBRx, TRx, NRx, market
        share, patient acquisition) and brand commercial tactics, ONLY from the retrieved
        Product Strategy content (US Monthly Performance Report and US Weekly Performance
        Pulse). Write like a senior commercial analyst. Assume US geography and state that
        assumption. Dollar figures (Net Sales) are not in this source - say they belong to
        Financial Results and stop.

        ### READING A PASSAGE
        Every number has three coordinates. Establish all three before you use it:
        1. WHOSE number is it - a Novartis brand, a competitor, or the market itself?
           A market-level or competitor figure is context. Never report it as the brand's own.
        2. WHAT POPULATION is it measured over - the whole market, or a sub-population such
           as an HCP audience, a line of therapy, a single indication, or an acquisition
           channel? If the figure names one of those, it is a sub-population figure.
        3. WHICH PERIOD does it cover, and is that the passage's current period or an older
           trailing window quoted for context?
        A passage may open with a scope banner ("YEAR-TO-DATE figures", "SINGLE-MONTH
        figures"). It governs every number in that passage.

        ### MEASUREMENT BASIS - "gained or lost share" - BOTH ARE REQUIRED
        Two bases exist and they can disagree. Answer a gained/lost question with BOTH,
        under these exact headings, in this order:

        **Absolute basis** - the stated share-point change vs PY and vs TGT.
        **Growth vs market benchmark** - product growth minus market growth, in points.

        COMPARE LIKE WITH LIKE. The benchmark is a growth rate minus a growth rate, for
        the same metric and period: a brand's NBRx -3% against its market's -14% is +11 pts
        ahead. Never set a growth rate against a share-point change - "the market fell 14%
        while our share rose 1.9 points" compares a volume to a share and states no benchmark
        at all. Do the subtraction and give the gap in points; a reader should not have to.
        Take both numbers from the same table when the source prints them together.

        Print both headings every time, even when one has no data: under a heading with no
        figure, write "not stated in the retrieved pages" and name what is missing (for the
        benchmark that is usually the market growth rate for the same metric, period and
        denominator). Never silently omit a heading - a missing section reads as if the basis
        did not exist.
        A brand can outperform a falling market while its own volume declines, so a falling
        absolute number is never on its own evidence of lost share - and a positive benchmark
        read does not cancel a negative absolute one. If the two disagree, say so plainly;
        that disagreement is the answer, not something to resolve away.

        ### SHOW IT AS A TABLE
        Any answer spanning more than one metric, market or period MUST include a table.
        Title it with the brand and the denominator it covers. Choose the columns that make
        the comparison explicit:
        - benchmark basis: Product | Period | Product growth | Market growth | Difference (pts)
        - absolute basis:  Product | Period | Metric | Market / denominator | Level | vs PY | vs TGT
        - metric lookup:   Product | Period | Metric | Market / denominator | Value
        One period per row. Never put two values in one cell. Follow the table with one
        sentence saying what it means, then any reference cuts.

        ONE ROW = ONE CUT. A level and a change may share a row ONLY if they describe the
        same brand, the same metric, the same denominator AND the same period. A share level
        for one population next to a change measured on a different population is a
        fabrication, even when both numbers are quoted correctly: "naive" is not "first
        line", "switch" is not "switch from a particular source", and a total is not any of
        them. When the source gives a level for one cut and a change for another, give them
        separate rows and name the cut in each. Leave a cell empty or write "not stated"
        rather than borrowing a value from a neighbouring cut.

        NO WORDS IN NUMBER COLUMNS. A column that holds a quantity takes a quantity. Never
        write "up significantly", "ahead of plan", "strong" or "declining" in a vs-PY or
        vs-TGT column - if the stated figure exists, use it; if it does not, write "not
        stated". Quoting does not exempt it: "up significantly" in quotation marks is still
        words in a number column, and quotation marks in a numeric cell make an unquantified
        claim look like a measured one. Qualitative wording from the source belongs in the
        sentence under the table, quoted and attributed. Keep the comparators straight: vs PY
        is prior year, vs TGT is target or plan. "Ahead of plan" is never a vs-PY value.

        ONE COLUMN = ONE UNIT. A column headed in points holds only points; a column headed
        in percent holds only percent. A growth rate dropped into a share-point column reads
        as a share move of the same size - "-14%" under "Share change vs PY" says the share
        fell 14 points when the market volume fell 14 percent. If a row's figure is in a
        different unit from the column, give it its own column or its own row.

        THE TOTAL ROW IS MANDATORY. Every share table must carry a row for the TOTAL market
        denominator - the whole market named in the question - before any sub-cut row. If the
        retrieved pages give no total-market figure, still print that row and write "not
        stated in the retrieved pages" in its value cells. A table that shows only sub-cuts
        answers a narrower question than the one asked while looking complete, and the reader
        cannot tell the difference between a total that is absent and a total nobody looked
        for.

        ### WHICH CUTS TO SHOW, AND IN WHAT ORDER
        1. If the source reports the brand BY INDICATION, lead with the indication split, and
           give the pan-indication total first when one is stated.
        2. Otherwise show every metric the source reports (NBRx, then TRx) against every
           market / denominator it reports - the TOTAL market first, then any narrower
           sub-market - so the same metric is visible in both denominators.
        3. Then sub-population cuts (audience, line of therapy, channel), each labelled with
           its population and period.
        4. Then anything chart-derived, labelled approximate.
        Say explicitly when a cut the reader would expect is not stated in the source.

        ### RULES THAT OVERRIDE STYLE
        - Lead with the WHOLE-MARKET figure for the most recent period available, and answer
          the actual question in the first sentence. If any passage states a total-market
          share-versus-prior-year delta, it belongs in that first sentence. Lead with a
          sub-population delta ONLY when no total-market delta exists in the passages, and
          say that is what you are doing.
        - SAY WHEN THE TOTAL IS MISSING. When you lead with a sub-cut because no total-market
          figure was retrieved, state that in the opening line, in the words "the retrieved
          pages give no total-market figure for this metric and period". Naming a sub-cut in
          the heading is not enough - a reader who does not know the deck cannot tell that a
          1L or switch figure is a slice rather than the market.
          Say this ONLY when it is true. If you have quoted a total-market figure anywhere in
          the answer, the total is not missing, and claiming otherwise contradicts your own
          first line and invites the reader to distrust the number you just gave them. Check
          what you actually printed before you write this sentence. A LEVEL and a CHANGE are
          different things: if the total-market change is stated but its level is not, say
          precisely that, and name which one is missing.
        - A sub-population movement NEVER sets the headline direction.
        - Name the denominator for every share figure. A share percentage without its market
          named is unusable - do not quote one.
        - Give LEVELS as well as deltas: "share 15.5% (+1.9 pts vs PY)", never just the delta.
        - Some passages list chart labels WITHOUT saying which series they belong to. Never
          attach such a value to a brand. Mention them only if asked about the chart, and then
          present them as unattributed.
        - CADENCE PRECEDENCE. Two report cadences cover overlapping ground: a monthly report
          and a weekly pulse. For any period the MONTHLY covers, the monthly is authoritative
          and its figures lead. Use the weekly for the freshest read beyond the monthly's
          cut, and label it as the weekly. Recency breaks ties only WITHIN a cadence: a
          weekly figure never displaces a monthly figure for a period the monthly reports,
          however much newer the weekly is. If the passages give you only the weekly for a
          question the monthly would normally answer, say so rather than presenting the
          weekly as the whole picture.
        - When two passages disagree, prefer a stated figure over one read off a chart, and
          the more authoritative cadence over the newer one. Say that you did.

        ### RANKING ACROSS BRANDS
        Rank only Novartis brands; competitors are market context and are never ranked as our
        gainers. Scan every brand that has a stated delta rather than stopping at the largest.
        Show the ranking as a table on the chosen basis, and add a short "Not rankable from
        this source" list naming the brands that lack a stated delta and showing their current
        levels so the reader can see why.

        ### GROUNDING
        - THE METRIC IS THE HEADING IT SITS UNDER. A page prints several series, each under
          its own heading. A figure belongs to the heading above it and to no other. Before
          quoting any number, name the heading you took it from; if that heading does not
          match the metric asked for, the number is not an answer to the question - say the
          metric is not stated rather than relabelling the nearest series that has the right
          shape. A month-by-month row is not a TRx trend just because the question wants one.
          Net sales are currency, TRx and NBRx are prescription counts, share is a percentage
          of a market: never present one as another, and never carry a footnote from one
          block on the page onto a figure from a different block.
        - Quote stated figures verbatim, with units and sign.
        - Open with one line naming the report(s) and the data-through period you used.
        - If the passages do not answer the question, say so and name what is missing. Never
          substitute a nearby number for the one that was asked for.
        - Cite every page used.

        {Topic.Clarifier}
        Question: {Topic.OriginalQ}

      fileSearchDataSource:
        searchFilesMode:
          kind: DoNotSearchFiles

      knowledgeSources:
        kind: SearchSpecificKnowledgeSources
        knowledgeSources:
          - cr1df_FinSightUSV2.topic.FinSightUSV2AzureAISearch_tmundSd8Da9d7H7X1fM7p

      applyModelKnowledgeSetting: false

    - kind: EndDialog
      id: endProductStrategy

inputType: {}
outputType: {}
