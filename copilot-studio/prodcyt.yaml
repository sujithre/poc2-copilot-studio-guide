kind: AdaptiveDialog

modelDescription: Use when the user asks about prescription or brand performance metrics - NBRx, TRx, NRx, market share, scripts, demand, patient starts - or brand commercial tactics, campaigns, or launch readiness.

beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent: {}

  actions:
    # ------------------------------------------------------------------
    # 1. Capture the user's question ONCE. It is never rewritten.
    #
    # The previous version appended the clarifier answer to the search text
    # ("...? for both eBC and mBC indications (overall)"). That changed what
    # was retrieved: it pulled another brand's indication pages into the
    # result set and pushed the correct figure out of the top 10 entirely.
    # A clarification is an INSTRUCTION about how to answer, not part of the
    # query. It is carried in Topic.Clarifier and injected into the
    # instructions, never into userInput.
    # ------------------------------------------------------------------
    - kind: SetVariable
      id: setOriginalQ
      displayName: Capture question
      variable: Topic.OriginalQ
      value: =System.Activity.Text

    - kind: SetVariable
      id: initClarifier
      displayName: Reset clarifier
      variable: Topic.Clarifier
      value: =""

    # ------------------------------------------------------------------
    # 2. Ask about indication ONLY when the question is about a brand that
    #    actually has multiple indications and has not already named one.
    #
    # This used to be the catch-all `elseActions` of the whole topic, so it
    # fired for every question that was not a trend question - including
    # questions about brands that have no breast-cancer indication at all.
    # There is no elseActions here on purpose: when the condition does not
    # match, flow simply continues to the single answer step below.
    # ------------------------------------------------------------------
    - kind: ConditionGroup
      id: maybeAskIndication
      displayName: Indication needed?
      conditions:
        - id: askIndication
          condition: |-
            =("kisqali" in Topic.OriginalQ)
            And Not("ebc" in Topic.OriginalQ)
            And Not("mbc" in Topic.OriginalQ)
            And Not("early breast" in Topic.OriginalQ)
            And Not("metastatic" in Topic.OriginalQ)
            And Not("pan-indication" in Topic.OriginalQ)
            And Not("both" in Topic.OriginalQ)
            And Not("overall" in Topic.OriginalQ)
          actions:
            - kind: Question
              id: questionIndication
              interruptionPolicy:
                allowInterruption: true

              variable: init:Topic.IndicationChoice
              prompt: `Quick check - is that for eBC (early breast cancer), mBC (metastatic), or both?`
              entity:
                kind: ClosedListEntityReference
                entityId: cr1df_FinSightUSV2.entity.Indication
                selectedItems:
                  - HThfpP
                  - tbIYEe
                  - 25ylsL

            - kind: SetVariable
              id: setIndicationScope
              displayName: Record indication scope
              variable: Topic.Clarifier
              value: |-
                =Topic.Clarifier & "INDICATION SCOPE CHOSEN BY THE USER: " & Text(Topic.IndicationChoice) & ". Restrict the answer to that indication; if the user chose both or overall, lead with the pan-indication total and then split by indication. "

    # ------------------------------------------------------------------
    # 3. Ask about period basis ONLY for a trend question that has not
    #    already stated its basis. Also a gated branch, not a fallback.
    # ------------------------------------------------------------------
    - kind: ConditionGroup
      id: maybeAskPeriodBasis
      displayName: Period basis needed?
      conditions:
        - id: askPeriodBasis
          condition: |-
            =(("trend" in Topic.OriginalQ)
              Or ("last 3 periods" in Topic.OriginalQ)
              Or ("last three" in Topic.OriginalQ)
              Or ("lately" in Topic.OriginalQ))
            And Not("r3m" in Topic.OriginalQ)
            And Not("rolling" in Topic.OriginalQ)
            And Not("trailing" in Topic.OriginalQ)
            And Not("calendar month" in Topic.OriginalQ)
          actions:
            - kind: Question
              id: questionPeriodBasis
              interruptionPolicy:
                allowInterruption: true

              variable: init:Topic.BasisChoice
              prompt: `Quick check - the last 3 calendar months, or a rolling 3-month (R3M) basis?`
              entity:
                kind: ClosedListEntityReference
                entityId: cr1df_FinSightUSV2.entity.PeriodBasis
                selectedItems:
                  - vPH7Yg
                  - tVcEiS

            - kind: SetVariable
              id: setPeriodScope
              displayName: Record period basis
              variable: Topic.Clarifier
              value: |-
                =Topic.Clarifier & "PERIOD BASIS CHOSEN BY THE USER: " & Text(Topic.BasisChoice) & ". Use that basis and say which one you used. "

    # ------------------------------------------------------------------
    # 4. ONE answer step, ONE set of instructions.
    #
    # There used to be four copies of these instructions across four
    # branches, and they had drifted apart: the two branches reachable by a
    # plain "did X gain or lose share" question were missing the rule that
    # stops a sub-population figure being reported as the whole-market read.
    # Any rule that lives in only one branch protects only the questions
    # that happen to land there.
    #
    # The rules below are keyed on properties of the data (whose number,
    # which population, which period) rather than on named brands or worked
    # examples, so a new brand or a new deck inherits them unchanged.
    # ------------------------------------------------------------------
    - kind: SearchAndSummarizeContent
      id: answerProductStrategy
      displayName: Answer from Product Strategy
      userInput: =Topic.OriginalQ

      additionalInstructions: |-
        You answer questions about US brand performance metrics (NBRx, TRx, NRx, market
        share, patient acquisition) and brand commercial tactics, ONLY from the retrieved
        Product Strategy content (US Monthly Performance Report and US Weekly Performance
        Pulse). Assume US geography and state that assumption. Dollar figures (Net Sales)
        are not in this source - say they belong to Financial Results and stop.

        ### READING A PASSAGE
        Every number has three coordinates. Establish all three before you use it:
        1. WHOSE number is it - a Novartis brand, a competitor, or the market itself?
           A market-level or competitor figure is context. Never report it as the brand's own.
        2. WHAT POPULATION is it measured over - the whole market, or a sub-population such
           as an HCP audience, a line of therapy, a single indication, or an acquisition
           channel? If the figure names one of those, it is a sub-population figure.
        3. WHICH PERIOD does it cover, and is that the passage's own current period or an
           older trailing window quoted for context?
        A passage may open with a scope banner (for example "YEAR-TO-DATE figures" or
        "SINGLE-MONTH figures"). It governs every number in that passage.

        ### ANSWERING
        - Lead with the WHOLE-MARKET figure for the most recent period available, and answer
          the actual question in the first sentence.
        - Add sub-population figures and older windows afterwards, each labelled with its
          population and its period.
        - A sub-population movement NEVER sets the headline direction. If the only figure you
          have is a sub-population one, say so plainly instead of generalising from it.
        - Name the denominator for every share figure. A share percentage without its market
          named is unusable - do not quote one.
        - Never infer direction from an absolute value alone. A brand can gain share while its
          own volume falls, if the market falls faster. When a passage gives both brand growth
          and market growth, state the difference in points.
        - Some passages list chart labels WITHOUT saying which series they belong to. Never
          attach such a value to a brand. Mention them only if asked about the chart, and then
          present them as unattributed.
        - When two passages disagree, prefer the one that states a figure over one that reads
          it off a chart, and the more recent period over the older one. Say that you did.

        ### GROUNDING
        - Quote stated figures verbatim, with units and sign.
        - Open with one line naming the report(s) and the data-through period you used.
        - If the retrieved passages do not answer the question, say so and name what is
          missing. Never substitute a nearby number for the one that was asked for.
        - Cite every page used.

        ### STYLE
        Write like a senior commercial analyst: quantified, specific, no hedging, no restating
        the question. Answer first, evidence second, caveats last.

        {Topic.Clarifier}
        Question: {Topic.OriginalQ}

      fileSearchDataSource:
        searchFilesMode:
          kind: DoNotSearchFiles

      knowledgeSources:
        kind: SearchSpecificKnowledgeSources
        knowledgeSources:
          - cr1df_FinSightUSV2.topic.FinSightUSV2AzureAISearch_tmundSd8Da9d7H7X1fM7p

      applyModelKnowledgeSetting: false

    - kind: EndDialog
      id: endProductStrategy

inputType: {}
outputType: {}
